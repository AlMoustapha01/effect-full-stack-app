pre-commit:
  parallel: true
  jobs:
    - name: lint
      glob: "*.{ts,tsx,js,jsx}"
      run: bunx oxlint --fix {staged_files} && git add {staged_files}
    - name: format
      glob: "*.{ts,tsx,js,jsx,json,css,md}"
      run: bunx oxfmt --write {staged_files} && git add {staged_files}

pre-push:
  parallel: true
  jobs:
    - name: lint
      run: bun run lint
    - name: format
      run: bun run format:check
    - name: typecheck
      run: bun run typecheck
    - name: test
      run: bun run test
