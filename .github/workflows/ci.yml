name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.14

jobs:
  check:
    name: lint · format · typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        # --ignore-scripts skips `lefthook install`, which requires .git hooks
        # to be writable; CI doesn't run git hooks.
        run: bun install --frozen-lockfile --ignore-scripts

      - name: oxlint
        run: bun run lint

      - name: oxfmt --check
        run: bun run format:check

      - name: tsc --noEmit
        run: bun run typecheck

      - name: vitest
        run: bun run test

      - name: build (vite + nitro)
        run: bun run build
        env:
          # build evaluates `src/shared/server/env.ts` at SSR-time; provide
          # dummy values so the schema-decode succeeds in the build step.
          DATABASE_URL: postgres://test:test@localhost:5432/test
          BETTER_AUTH_SECRET: ci-build-secret-must-be-long-enough-for-validation
          BETTER_AUTH_URL: http://localhost:3000

  e2e:
    name: playwright e2e
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/app
      BETTER_AUTH_SECRET: ci-e2e-secret-must-be-long-enough-for-validation
      BETTER_AUTH_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Apply DB schema
        run: bun run db:push

      - name: Install Playwright browser (chromium only)
        run: bunx playwright install --with-deps chromium

      - name: Run e2e suite
        run: bun run test:e2e

      - name: Upload playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
